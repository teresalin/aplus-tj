services:
  pg:
    image: postgres:13
    volumes:
      - ./.db_data/data:/var/lib/postgresql/data/
      - ./db:/docker-entrypoint-initdb.d/
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_DB=postgres
      - POSTGRES_PASSWORD=password
    ports:
      - 5432:5432
    networks:
      - prisma-network
  web:
    build: .
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_DB=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_HOST=pg
    command: [ "npm", "run", "dev" ]
    ports:
      - 3000:3000
    depends_on:
      - "pg"

networks:
  prisma-network: