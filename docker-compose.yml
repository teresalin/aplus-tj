services:
  pg:
    image: postgres:15
    container_name: pg
    volumes:
      - ./.db_data/data:/var/lib/postgresql/data/
      - ./db:/docker-entrypoint-initdb.d/
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_DB=postgres
      - POSTGRES_PASSWORD=password
    ports:
      - "5432:5432"

  web:
    build: .
    container_name: web
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - DATABASE_URL=postgresql://postgres:password@pg:5432/postgres?schema=public
    command: ["npm","run","dev"]
    ports:
      - "3000:3000"
    depends_on:
      - pg
    links:
      - pg           # ← this will put “172.x.x.x pg” into /etc/hosts
